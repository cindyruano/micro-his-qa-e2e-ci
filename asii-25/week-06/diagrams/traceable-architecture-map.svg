<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760" style="background-color: #ffffff;">
  <style>
    text { font-family: Arial, sans-serif; fill: #17202a; }
    .title { font-size: 24px; font-weight: bold; fill: #17202a; }
    .actor { fill: #fef5e7; stroke: #ca6f1e; stroke-width: 2; }
    .api { fill: #eaf2f8; stroke: #2874a6; stroke-width: 2; }
    .layer { fill: #e8f8f5; stroke: #138d75; stroke-width: 2; }
    .domain { fill: #f5eef8; stroke: #7d3c98; stroke-width: 2; }
    .data { fill: #fdf2e9; stroke: #a04000; stroke-width: 2; }
    .component { fill: #ffffff; stroke: #566573; stroke-width: 1.5; }
    .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .async { stroke: #7d3c98; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#purple); }
    .label { font-size: 12px; fill: #34495e; font-weight: bold; }
    .footer-note { font-size: 14px; fill: #17202a; font-weight: bold; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7d3c98"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="625" y="38" text-anchor="middle" class="title">ASII-25 - Mapa trazable de arquitectura</text>

  <rect class="actor" x="35" y="105" width="190" height="130" rx="10"/>
  <text x="130" y="140" text-anchor="middle" font-size="17" font-weight="bold">Actores</text>
  <text x="130" y="170" text-anchor="middle" font-size="13">Developer / QA Lead</text>
  <text x="130" y="195" text-anchor="middle" font-size="13">CI Runner / HIS Tenant</text>

  <rect class="api" x="285" y="80" width="260" height="180" rx="10"/>
  <text x="415" y="115" text-anchor="middle" font-size="18" font-weight="bold">API REST</text>
  <text x="415" y="145" text-anchor="middle" font-size="13">runs / gates / evidence</text>
  <rect class="component" x="325" y="170" width="180" height="45" rx="5"/>
  <text x="415" y="198" text-anchor="middle" font-size="13">Controller + JSON View</text>

  <rect class="layer" x="605" y="80" width="270" height="180" rx="10"/>
  <text x="740" y="115" text-anchor="middle" font-size="18" font-weight="bold">Capas</text>
  <text x="740" y="148" text-anchor="middle" font-size="13">Application Use Cases</text>
  <text x="740" y="178" text-anchor="middle" font-size="13">Domain + Quality Gate</text>
  <text x="740" y="208" text-anchor="middle" font-size="13">Repository Interface</text>

  <rect class="domain" x="935" y="80" width="280" height="180" rx="10"/>
  <text x="1075" y="115" text-anchor="middle" font-size="18" font-weight="bold">Contrato y patrones</text>
  <text x="1075" y="148" text-anchor="middle" font-size="13">SOLID / DIP / Repository</text>
  <text x="1075" y="178" text-anchor="middle" font-size="13">OpenAPI 3.0 / JSON Schema</text>
  <text x="1075" y="208" text-anchor="middle" font-size="13">JWT + X-Tenant-ID</text>

  <rect class="data" x="285" y="390" width="260" height="170" rx="10"/>
  <text x="415" y="425" text-anchor="middle" font-size="18" font-weight="bold">Persistencia</text>
  <text x="415" y="458" text-anchor="middle" font-size="13">PDO / SQLite / InMemory</text>
  <text x="415" y="488" text-anchor="middle" font-size="13">runs + audit + tenant_id</text>
  <text x="415" y="518" text-anchor="middle" font-size="13">evidence_hash</text>

  <rect class="layer" x="605" y="390" width="270" height="170" rx="10"/>
  <text x="740" y="425" text-anchor="middle" font-size="18" font-weight="bold">Cambio defendido</text>
  <text x="740" y="458" text-anchor="middle" font-size="13">E2E concurrente por tenant</text>
  <text x="740" y="488" text-anchor="middle" font-size="13">worker de compresión</text>
  <text x="740" y="518" text-anchor="middle" font-size="13">SHA-256 y estados atómicos</text>

  <rect class="domain" x="935" y="390" width="280" height="170" rx="10"/>
  <text x="1075" y="425" text-anchor="middle" font-size="18" font-weight="bold">Quality Gate</text>
  <text x="1075" y="458" text-anchor="middle" font-size="13">p95 API &lt; 2 s</text>
  <text x="1075" y="488" text-anchor="middle" font-size="13">0 fallos críticos</text>
  <text x="1075" y="518" text-anchor="middle" font-size="13">PR aprobado o bloqueado</text>

  <path class="arrow" d="M225 170 H285"/>
  <path class="arrow" d="M545 170 H605"/>
  <path class="arrow" d="M875 170 H935"/>
  <path class="arrow" d="M740 260 V390"/>
  <path class="arrow" d="M545 475 H605"/>
  <path class="arrow" d="M875 475 H935"/>
  <path class="async" d="M740 560 V650"/>

  <text x="255" y="160" text-anchor="middle" class="label">HTTP</text>
  <text x="575" y="160" text-anchor="middle" class="label">use case</text>
  <text x="905" y="160" text-anchor="middle" class="label">contrato</text>
  <text x="760" y="330" class="label">persistencia</text>
  <text x="575" y="465" text-anchor="middle" class="label">datos</text>
  <text x="905" y="465" text-anchor="middle" class="label">métricas</text>
  <text x="760" y="625" class="label">evidencia asíncrona</text>

  <text x="625" y="710" text-anchor="middle" class="footer-note">Trazabilidad: requisito -&gt; decisión -&gt; principio -&gt; código/test -&gt; evidencia</text>
</svg>
