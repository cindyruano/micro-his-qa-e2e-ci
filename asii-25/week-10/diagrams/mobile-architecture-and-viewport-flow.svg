<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="720" viewBox="0 0 1250 720" style="background-color: #ffffff;">
  <style>
    text { font-family: Arial, sans-serif; fill: #17202a; }
    .title { font-size: 24px; font-weight: bold; fill: #17202a; }
    .vp { fill: #eaf2f8; stroke: #2874a6; stroke-width: 2; }
    .screen { fill: #fef5e7; stroke: #ca6f1e; stroke-width: 2; }
    .offline { fill: #f5eef8; stroke: #7d3c98; stroke-width: 2; }
    .safe { fill: #e8f8f5; stroke: #138d75; stroke-width: 2; }
    .comp { fill: #ffffff; stroke: #566573; stroke-width: 1.5; }
    .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#a); }
    .dash { stroke: #7d3c98; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#p); }
    .label { font-size: 12px; fill: #34495e; font-weight: bold; }
    .footer-note { font-size: 14px; fill: #17202a; font-weight: bold; }
  </style>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7d3c98"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="625" y="38" text-anchor="middle" class="title">ASII-25 - Diseño móvil del flujo QA</text>

  <rect class="vp" x="35" y="90" width="240" height="180" rx="10"/>
  <text x="155" y="125" text-anchor="middle" font-size="18" font-weight="bold">xs 320–430 px</text>
  <text x="155" y="158" text-anchor="middle" font-size="13">Una columna / cards</text>
  <text x="155" y="185" text-anchor="middle" font-size="13">Bottom navigation</text>
  <text x="155" y="212" text-anchor="middle" font-size="13">Touch 44x44 px</text>
  <text x="155" y="239" text-anchor="middle" font-size="13">Estado y acción primero</text>

  <rect class="vp" x="35" y="360" width="240" height="180" rx="10"/>
  <text x="155" y="395" text-anchor="middle" font-size="18" font-weight="bold">sm 431–768 px</text>
  <text x="155" y="428" text-anchor="middle" font-size="13">Grid de métricas</text>
  <text x="155" y="455" text-anchor="middle" font-size="13">Drawer de filtros</text>
  <text x="155" y="482" text-anchor="middle" font-size="13">Acordeón de metadatos</text>

  <rect class="screen" x="350" y="90" width="260" height="180" rx="10"/>
  <text x="480" y="125" text-anchor="middle" font-size="18" font-weight="bold">Pantallas móviles</text>
  <rect class="comp" x="385" y="145" width="190" height="32" rx="5"/>
  <text x="480" y="166" text-anchor="middle" font-size="13">Dashboard de Runs</text>
  <rect class="comp" x="385" y="190" width="190" height="32" rx="5"/>
  <text x="480" y="211" text-anchor="middle" font-size="13">Planificar / Evidencia</text>
  <rect class="comp" x="385" y="235" width="190" height="22" rx="5"/>
  <text x="480" y="250" text-anchor="middle" font-size="12">Quality Gate</text>

  <rect class="safe" x="685" y="90" width="250" height="180" rx="10"/>
  <text x="810" y="125" text-anchor="middle" font-size="18" font-weight="bold">Contenido prioritario</text>
  <text x="810" y="158" text-anchor="middle" font-size="13">tenant / estado / Gate</text>
  <text x="810" y="185" text-anchor="middle" font-size="13">commit / suite / acción</text>
  <text x="810" y="212" text-anchor="middle" font-size="13">hash bajo demanda</text>
  <text x="810" y="239" text-anchor="middle" font-size="13">headers colapsados</text>

  <rect class="offline" x="1010" y="90" width="205" height="180" rx="10"/>
  <text x="1112" y="125" text-anchor="middle" font-size="18" font-weight="bold">Offline</text>
  <text x="1112" y="158" text-anchor="middle" font-size="13">Cache Storage</text>
  <text x="1112" y="185" text-anchor="middle" font-size="13">Background Sync</text>
  <text x="1112" y="212" text-anchor="middle" font-size="13">retry idempotente</text>
  <text x="1112" y="239" text-anchor="middle" font-size="13">Online / Offline</text>

  <path class="arrow" d="M275 180 H350"/>
  <path class="arrow" d="M610 180 H685"/>
  <path class="dash" d="M935 180 H1010"/>
  <path class="arrow" d="M155 270 V360"/>

  <text x="312" y="170" text-anchor="middle" class="label">responsive</text>
  <text x="647" y="170" text-anchor="middle" class="label">jerarquía</text>
  <text x="972" y="170" text-anchor="middle" class="label">red limitada</text>

  <rect class="safe" x="350" y="410" width="585" height="125" rx="10"/>
  <text x="642" y="445" text-anchor="middle" font-size="18" font-weight="bold">Recuperación segura</text>
  <text x="642" y="478" text-anchor="middle" font-size="13">Snapshot no sensible · último estado conocido · revalidar JWT al volver online</text>
  <text x="642" y="508" text-anchor="middle" font-size="13">No repetir POST sin Idempotency-Key · descargar evidencia solo online y autorizado</text>

  <path class="dash" d="M1112 270 V472 H935"/>
  <text x="1025" y="460" class="label">reconectar y sincronizar</text>

  <text x="625" y="640" text-anchor="middle" class="footer-note">Mobile-first: reducir carga cognitiva sin perder tenant, trazabilidad, seguridad ni Quality Gate</text>
</svg>
