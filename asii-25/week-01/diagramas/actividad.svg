<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" style="background-color: #ffffff;">
  <style>text{font-family:Arial,sans-serif;fill:#17202a} .step{fill:#eaf2f8;stroke:#2874a6;stroke-width:2} .decision{fill:#fef5e7;stroke:#ca6f1e;stroke-width:2} .line{stroke:#566573;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#566573"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#17202a">ASII-25 - Actividad de validación E2E en CI</text>
  <circle cx="400" cy="65" r="12" fill="#17202a"/><path class="line" d="M400 77 V105"/>
  <rect class="step" x="270" y="105" width="260" height="48" rx="24"/><text x="400" y="135" text-anchor="middle" font-size="15">Recibir PR y registrar commit</text><path class="line" d="M400 153 V180"/>
  <rect class="step" x="270" y="180" width="260" height="48" rx="24"/><text x="400" y="210" text-anchor="middle" font-size="15">Preparar entorno y tenant</text><path class="line" d="M400 228 V255"/>
  <rect class="step" x="270" y="255" width="260" height="48" rx="24"/><text x="400" y="285" text-anchor="middle" font-size="15">Ejecutar suites E2E</text><path class="line" d="M400 303 V330"/>
  <rect class="step" x="270" y="330" width="260" height="48" rx="24"/><text x="400" y="360" text-anchor="middle" font-size="15">Validar API, tenant y RBAC</text><path class="line" d="M400 378 V410"/>
  <polygon class="decision" points="400,410 500,460 400,510 300,460"/><text x="400" y="456" text-anchor="middle" font-size="15">¿Quality Gate</text><text x="400" y="476" text-anchor="middle" font-size="15">pasa?</text>
  <path class="line" d="M300 460 H145 V555"/><text x="210" y="450" font-size="14">No</text><rect class="step" x="35" y="555" width="220" height="48" rx="24"/><text x="145" y="585" text-anchor="middle" font-size="15">Publicar fallos y bloquear PR</text><path class="line" d="M145 603 V655 H400"/>
  <path class="line" d="M500 460 H655 V555"/><text x="560" y="450" font-size="14">Sí</text><rect class="step" x="545" y="555" width="220" height="48" rx="24"/><text x="655" y="585" text-anchor="middle" font-size="15">Publicar métricas y aprobar PR</text><path class="line" d="M655 603 V655 H400"/>
  <path class="line" d="M400 510 V655"/><rect class="step" x="270" y="655" width="260" height="48" rx="24"/><text x="400" y="685" text-anchor="middle" font-size="15">Conservar auditoría y artefactos</text><path class="line" d="M400 703 V730"/><circle cx="400" cy="742" r="12" fill="none" stroke="#17202a" stroke-width="3"/>
</svg>
