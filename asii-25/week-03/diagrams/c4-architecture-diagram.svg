  <rect class="component" x="730" y="560" width="170" height="42" rx="5"/>
  <text x="815" y="586" text-anchor="middle" font-size="13">Evidence Storage</text>

  <rect class="external" x="480" y="675" width="240" height="55" rx="8"/>
  <text x="600" y="708" text-anchor="middle" font-size="15" font-weight="bold">micro-his.sqlite / Filesystem / S3</text>

  <path class="arrow" d="M210 150 H300"/>
  <path class="arrow" d="M900 150 H990"/>
  <path class="arrow" d="M600 190 V220"/>
  <path class="arrow" d="M600 335 V365"/>
  <path class="arrow" d="M600 480 V510"/>
  <path class="arrow" d="M600 625 V675"/>

  <text x="600" y="208" text-anchor="middle" class="arrow-text">commands / responses</text>
  <text x="600" y="353" text-anchor="middle" class="arrow-text">políticas y entidades</text>
  <text x="600" y="498" text-anchor="middle" class="arrow-text">puertos implementados</text>
</svg>
