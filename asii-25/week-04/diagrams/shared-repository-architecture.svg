<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" style="background-color: #ffffff;">
  <style>
    text { font-family: Arial, sans-serif; fill: #17202a; }
    .title { font-size: 24px; font-weight: bold; fill: #17202a; }
    .box { stroke: #34495e; stroke-width: 2; }
    .qa { fill: #eaf2f8; }
    .his { fill: #e8f8f5; }
    .repo { fill: #fef5e7; }
    .ext { fill: #f8f9f9; stroke: #7b7d7d; stroke-width: 2; }
    .component { fill: #ffffff; stroke: #566573; stroke-width: 1.5; }
    .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .label { font-size: 12px; fill: #34495e; font-weight: bold; }
    .footer-note { font-size: 14px; fill: #17202a; font-weight: bold; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" class="title">ASII-25 - Integración con repositorio compartido del HIS</text>

  <rect class="ext" x="35" y="110" width="180" height="100" rx="8"/>
  <text x="125" y="145" text-anchor="middle" font-size="16" font-weight="bold">Developer / QA</text>
  <text x="125" y="172" text-anchor="middle" font-size="13">PR y revisión</text>

  <rect class="ext" x="35" y="330" width="180" height="100" rx="8"/>
  <text x="125" y="365" text-anchor="middle" font-size="16" font-weight="bold">CI / E2E Runner</text>
  <text x="125" y="392" text-anchor="middle" font-size="13">Suites y métricas</text>

  <rect class="box qa" x="290" y="80" width="320" height="390" rx="10"/>
  <text x="450" y="112" text-anchor="middle" font-size="18" font-weight="bold">Micro-HIS QA</text>

  <rect class="component" x="330" y="145" width="240" height="48" rx="5"/>
  <text x="450" y="175" text-anchor="middle" font-size="14">ExecutionController</text>

  <rect class="component" x="330" y="225" width="240" height="48" rx="5"/>
  <text x="450" y="255" text-anchor="middle" font-size="14">ExecuteTestSuiteUseCase</text>

  <rect class="component" x="330" y="305" width="240" height="48" rx="5"/>
  <text x="450" y="335" text-anchor="middle" font-size="14">Repository Interface</text>

  <rect class="component" x="330" y="385" width="240" height="48" rx="5"/>
  <text x="450" y="415" text-anchor="middle" font-size="14">Tenant / Quality Gate</text>

  <rect class="box repo" x="700" y="100" width="430" height="300" rx="10"/>
  <text x="915" y="132" text-anchor="middle" font-size="18" font-weight="bold">Repositorio de datos compartido</text>

  <rect class="component" x="745" y="165" width="340" height="52" rx="5"/>
  <text x="915" y="197" text-anchor="middle" font-size="14">PdoTestExecutionRepository</text>

  <rect class="component" x="745" y="245" width="340" height="52" rx="5"/>
  <text x="915" y="277" text-anchor="middle" font-size="14">test_executions + audit_events</text>

  <rect class="component" x="745" y="325" width="340" height="52" rx="5"/>
  <text x="915" y="357" text-anchor="middle" font-size="14">tenant_id + transacciones PDO</text>

  <rect class="ext" x="700" y="500" width="430" height="100" rx="8"/>
  <text x="915" y="535" text-anchor="middle" font-size="16" font-weight="bold">Evidence Storage</text>
  <text x="915" y="563" text-anchor="middle" font-size="13">Filesystem / S3 por tenant y ejecución</text>

  <path class="arrow" d="M215 160 H330"/>
  <path class="arrow" d="M215 380 H330"/>
  <path class="arrow" d="M570 329 H745"/>
  <path class="arrow" d="M915 400 V500"/>

  <text x="265" y="150" text-anchor="middle" class="label">PR</text>
  <text x="265" y="370" text-anchor="middle" class="label">resultados E2E</text>
  <text x="655" y="318" text-anchor="middle" class="label">PDO + SQL preparado</text>
  <text x="955" y="455" text-anchor="middle" class="label">hash y artefactos</text>

  <text x="600" y="665" text-anchor="middle" class="footer-note">Todas las lecturas y escrituras se filtran por X-Tenant-ID / tenant_id</text>
</svg>
