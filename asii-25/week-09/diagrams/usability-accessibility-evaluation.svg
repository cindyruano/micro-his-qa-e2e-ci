<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="720" viewBox="0 0 1250 720" style="background-color: #ffffff;">
  <style>
    text { font-family: Arial, sans-serif; fill: #17202a; }
    .title { font-size: 24px; font-weight: bold; fill: #17202a; }
    .surface { fill: #eaf2f8; stroke: #2874a6; stroke-width: 2; }
    .heur { fill: #fef5e7; stroke: #ca6f1e; stroke-width: 2; }
    .wcag { fill: #e8f8f5; stroke: #138d75; stroke-width: 2; }
    .backlog { fill: #f5eef8; stroke: #7d3c98; stroke-width: 2; }
    .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#a); }
    .label { font-size: 12px; fill: #34495e; font-weight: bold; }
    .footer-note { font-size: 14px; fill: #17202a; font-weight: bold; }
  </style>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="625" y="38" text-anchor="middle" class="title">ASII-25 - Evaluación UX, usabilidad y accesibilidad</text>

  <rect class="surface" x="35" y="100" width="250" height="190" rx="10"/>
  <text x="160" y="135" text-anchor="middle" font-size="18" font-weight="bold">Superficies evaluadas</text>
  <text x="160" y="170" text-anchor="middle" font-size="13">Dashboard de Runs</text>
  <text x="160" y="198" text-anchor="middle" font-size="13">Modal de planificación</text>
  <text x="160" y="226" text-anchor="middle" font-size="13">Visor de evidencias</text>
  <text x="160" y="254" text-anchor="middle" font-size="13">Quality Gate</text>

  <rect class="heur" x="365" y="85" width="250" height="220" rx="10"/>
  <text x="490" y="120" text-anchor="middle" font-size="18" font-weight="bold">Nielsen 1-10</text>
  <text x="490" y="155" text-anchor="middle" font-size="13">Estado visible</text>
  <text x="490" y="183" text-anchor="middle" font-size="13">Control y prevención</text>
  <text x="490" y="211" text-anchor="middle" font-size="13">Consistencia</text>
  <text x="490" y="239" text-anchor="middle" font-size="13">Errores recuperables</text>
  <text x="490" y="267" text-anchor="middle" font-size="13">Ayuda contextual</text>

  <rect class="wcag" x="695" y="85" width="250" height="220" rx="10"/>
  <text x="820" y="120" text-anchor="middle" font-size="18" font-weight="bold">WCAG AA</text>
  <text x="820" y="155" text-anchor="middle" font-size="13">Perceptible: contraste</text>
  <text x="820" y="183" text-anchor="middle" font-size="13">Operable: teclado/foco</text>
  <text x="820" y="211" text-anchor="middle" font-size="13">Comprensible: errores</text>
  <text x="820" y="239" text-anchor="middle" font-size="13">Robusto: ARIA/live</text>
  <text x="820" y="267" text-anchor="middle" font-size="13">Lectores de pantalla</text>

  <rect class="backlog" x="1025" y="100" width="190" height="190" rx="10"/>
  <text x="1120" y="135" text-anchor="middle" font-size="18" font-weight="bold">Backlog</text>
  <text x="1120" y="170" text-anchor="middle" font-size="13">P1: teclado, live,</text>
  <text x="1120" y="195" text-anchor="middle" font-size="13">contraste, confirmar</text>
  <text x="1120" y="230" text-anchor="middle" font-size="13">P2: hash, progreso</text>
  <text x="1120" y="260" text-anchor="middle" font-size="13">criterio verificable</text>

  <path class="arrow" d="M285 195 H365"/>
  <path class="arrow" d="M615 195 H695"/>
  <path class="arrow" d="M945 195 H1025"/>

  <rect class="surface" x="240" y="410" width="770" height="135" rx="10"/>
  <text x="625" y="445" text-anchor="middle" font-size="18" font-weight="bold">Evidencia de evaluación</text>
  <text x="625" y="478" text-anchor="middle" font-size="13">Pasos reproducibles · captura antes/después · criterio WCAG/heurística · prueba manual o automatizada</text>
  <text x="625" y="508" text-anchor="middle" font-size="13">navegador/lector · run_id · commit · Quality Gate · estado de corrección</text>

  <path class="arrow" d="M625 305 V410"/>
  <text x="625" y="355" text-anchor="middle" class="label">hallazgo -&gt; corrección</text>

  <text x="625" y="640" text-anchor="middle" class="footer-note">Objetivo: UX accesible sin perder seguridad, trazabilidad ni reproducibilidad CI</text>
</svg>
