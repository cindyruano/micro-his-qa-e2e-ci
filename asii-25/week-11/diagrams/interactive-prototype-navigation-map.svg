<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="680" viewBox="0 0 1250 680">
<style>text{font-family:Arial,sans-serif;fill:#17202a}.screen{fill:#eaf2f8;stroke:#2874a6;stroke-width:2}.happy{fill:#e8f8f5;stroke:#138d75;stroke-width:2}.error{fill:#fcebea;stroke:#a33131;stroke-width:2}.actor{fill:#fef5e7;stroke:#ca6f1e;stroke-width:2}.arrow{stroke:#34495e;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#a33131;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#r)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33131"/></marker></defs>
<text x="625" y="32" text-anchor="middle" font-size="24" font-weight="bold">ASII-25 - Mapa del prototipo navegable</text>
<rect class="actor" x="35" y="100" width="190" height="130" rx="10"/><text x="130" y="138" text-anchor="middle" font-size="18" font-weight="bold">Roles</text><text x="130" y="170" text-anchor="middle" font-size="13">QA Lead / Developer</text><text x="130" y="198" text-anchor="middle" font-size="13">CI Runner</text>
<rect class="screen" x="300" y="80" width="220" height="150" rx="10"/><text x="410" y="120" text-anchor="middle" font-size="18" font-weight="bold">Dashboard</text><text x="410" y="153" text-anchor="middle" font-size="13">Runs / tenant / Gate</text><text x="410" y="181" text-anchor="middle" font-size="13">Desktop + cards móvil</text>
<rect class="screen" x="600" y="80" width="220" height="150" rx="10"/><text x="710" y="120" text-anchor="middle" font-size="18" font-weight="bold">Planificar</text><text x="710" y="153" text-anchor="middle" font-size="13">Commit + suites</text><text x="710" y="181" text-anchor="middle" font-size="13">Validación y confirmación</text>
<rect class="screen" x="900" y="80" width="220" height="150" rx="10"/><text x="1010" y="120" text-anchor="middle" font-size="18" font-weight="bold">Run / Logs</text><text x="1010" y="153" text-anchor="middle" font-size="13">RUNNING / SHA-256</text><text x="1010" y="181" text-anchor="middle" font-size="13">Avanzar simulación</text>
<rect class="happy" x="600" y="370" width="220" height="150" rx="10"/><text x="710" y="410" text-anchor="middle" font-size="18" font-weight="bold">PASS</text><text x="710" y="443" text-anchor="middle" font-size="13">Gate aprobado</text><text x="710" y="471" text-anchor="middle" font-size="13">Evidence READY</text><text x="710" y="499" text-anchor="middle" font-size="13">Despliegue aprobado</text>
<rect class="error" x="900" y="370" width="220" height="150" rx="10"/><text x="1010" y="410" text-anchor="middle" font-size="18" font-weight="bold">FAIL</text><text x="1010" y="443" text-anchor="middle" font-size="13">Hash mismatch</text><text x="1010" y="471" text-anchor="middle" font-size="13">PR bloqueado</text><text x="1010" y="499" text-anchor="middle" font-size="13">Retry idempotente</text>
<path class="arrow" d="M225 165 H300"/><path class="arrow" d="M520 155 H600"/><path class="arrow" d="M820 155 H900"/><path class="arrow" d="M1010 230 V370"/><path class="arrow" d="M710 230 V370"/><path class="dash" d="M1010 520 V580 H710 V520"/><text x="625" y="610" text-anchor="middle" font-size="14">Responsive: >=1024 px desktop · 320–430 px móvil · estados y roles consistentes</text>
</svg>
