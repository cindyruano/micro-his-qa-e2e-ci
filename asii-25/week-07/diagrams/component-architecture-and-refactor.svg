<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="720" viewBox="0 0 1250 720" style="background-color: #ffffff;">
  <style>
    text { font-family: Arial, sans-serif; fill: #17202a; }
    .title { font-size: 24px; font-weight: bold; fill: #17202a; }
    .ui { fill: #fef5e7; stroke: #ca6f1e; stroke-width: 2; }
    .app { fill: #eaf2f8; stroke: #2874a6; stroke-width: 2; }
    .domain { fill: #e8f8f5; stroke: #138d75; stroke-width: 2; }
    .persist { fill: #f5eef8; stroke: #7d3c98; stroke-width: 2; }
    .old { fill: #f5b7b1; stroke: #922b21; stroke-width: 2; }
    .comp { fill: #ffffff; stroke: #566573; stroke-width: 1.5; }
    .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#a); }
    .label { font-size: 12px; fill: #34495e; font-weight: bold; }
    .footer-note { font-size: 14px; fill: #17202a; font-weight: bold; }
  </style>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="625" y="38" text-anchor="middle" class="title">ASII-25 - Componentes y refactorización</text>

  <rect class="ui" x="35" y="90" width="250" height="210" rx="10"/>
  <text x="160" y="125" text-anchor="middle" font-size="18" font-weight="bold">Frontend QA</text>
  <rect class="comp" x="70" y="150" width="180" height="42" rx="5"/>
  <text x="160" y="176" text-anchor="middle" font-size="14">QARunnerUI</text>
  <rect class="comp" x="70" y="220" width="180" height="42" rx="5"/>
  <text x="160" y="246" text-anchor="middle" font-size="14">EvidenceLogViewer</text>

  <rect class="app" x="345" y="90" width="260" height="210" rx="10"/>
  <text x="475" y="125" text-anchor="middle" font-size="18" font-weight="bold">Aplicación</text>
  <rect class="comp" x="380" y="150" width="190" height="42" rx="5"/>
  <text x="475" y="176" text-anchor="middle" font-size="14">ExecutionController</text>
  <rect class="comp" x="380" y="220" width="190" height="42" rx="5"/>
  <text x="475" y="246" text-anchor="middle" font-size="14">EvaluateQualityGate</text>

  <rect class="domain" x="665" y="90" width="250" height="210" rx="10"/>
  <text x="790" y="125" text-anchor="middle" font-size="18" font-weight="bold">Dominio</text>
  <rect class="comp" x="700" y="150" width="180" height="42" rx="5"/>
  <text x="790" y="176" text-anchor="middle" font-size="14">QualityGatePolicy</text>
  <rect class="comp" x="700" y="220" width="180" height="42" rx="5"/>
  <text x="790" y="246" text-anchor="middle" font-size="14">DTOs / Interfaces</text>

  <rect class="persist" x="975" y="90" width="240" height="210" rx="10"/>
  <text x="1095" y="125" text-anchor="middle" font-size="18" font-weight="bold">Persistencia</text>
  <rect class="comp" x="1005" y="150" width="180" height="42" rx="5"/>
  <text x="1095" y="176" text-anchor="middle" font-size="14">PdoRepository</text>
  <rect class="comp" x="1005" y="220" width="180" height="42" rx="5"/>
  <text x="1095" y="246" text-anchor="middle" font-size="14">EvidenceStorage</text>

  <path class="arrow" d="M285 195 H345"/>
  <path class="arrow" d="M605 195 H665"/>
  <path class="arrow" d="M915 195 H975"/>

  <text x="315" y="185" text-anchor="middle" class="label">JSON DTO</text>
  <text x="635" y="185" text-anchor="middle" class="label">caso de uso</text>
  <text x="945" y="185" text-anchor="middle" class="label">interfaces</text>

  <rect class="old" x="180" y="390" width="300" height="145" rx="10"/>
  <text x="330" y="425" text-anchor="middle" font-size="18" font-weight="bold">Antes: controlador monolítico</text>
  <text x="330" y="458" text-anchor="middle" font-size="13">HTTP + if del Gate + SQL</text>
  <text x="330" y="486" text-anchor="middle" font-size="13">hash + respuesta JSON</text>
  <text x="330" y="514" text-anchor="middle" font-size="13">múltiples razones de cambio</text>

  <rect class="domain" x="690" y="390" width="380" height="145" rx="10"/>
  <text x="880" y="425" text-anchor="middle" font-size="18" font-weight="bold">Después: responsabilidades aisladas</text>
  <text x="880" y="458" text-anchor="middle" font-size="13">Controller -&gt; Use Case -&gt; Policy</text>
  <text x="880" y="486" text-anchor="middle" font-size="13">Repository / Evidence adapters</text>
  <text x="880" y="514" text-anchor="middle" font-size="13">tests InMemory y despliegue reproducible</text>

  <path class="arrow" d="M480 462 H690"/>
  <text x="585" y="450" text-anchor="middle" class="label">refactor</text>

  <text x="625" y="640" text-anchor="middle" class="footer-note">Separación UI / Aplicación / Dominio / Persistencia sin ampliar el alcance</text>
</svg>
